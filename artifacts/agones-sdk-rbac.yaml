apiVersion: v1
kind: ServiceAccount
metadata:
  name: agones-sdk
  namespace: chariot-hoplites
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agones-sdk
  namespace: chariot-hoplites
rules:
- apiGroups: ["agones.dev"]
  resources: ["gameservers"]
  verbs: ["get", "update", "patch", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agones-sdk
  namespace: chariot-hoplites
subjects:
- kind: ServiceAccount
  name: agones-sdk
  namespace: chariot-hoplites
roleRef:
  kind: Role
  name: agones-sdk
  apiGroup: rbac.authorization.k8s.io
